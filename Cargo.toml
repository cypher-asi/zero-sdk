[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
rust-version = "1.78"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cypher-asi/zero-sdk"

[workspace.dependencies]
# Upstream ZID library, pinned to the exact commit SHA noted in the spec.
# `Cargo.lock` records the same revision; bump both together when upgrading.
zid = { git = "https://github.com/cypher-asi/zid", rev = "346a9f484567895a174b7ddc5f9ab88639b5f82c" }

# Async runtime
tokio = { version = "1.39", features = ["macros", "rt-multi-thread", "fs", "io-util", "sync", "time"] }

# Error handling (libraries only -- no anyhow allowed in library code)
thiserror = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
postcard = { version = "1.0", features = ["use-std"] }

# Cryptographic primitives
hkdf = "0.12"
sha2 = "0.10"
blake3 = "1.5"

# Identifiers
uuid = { version = "1.10", features = ["v7", "serde"] }

# CSPRNG (compatible with zid's rand_core 0.6 trait bounds)
rand = "0.8"

# Async trait + streaming
async-trait = "0.1"
futures-core = "0.3"

# Test-only deps shared across the workspace.
proptest = "1.5"
serde_json = "1.0"
hex = "0.4"
tempfile = "3.12"

[workspace.lints.clippy]
pedantic = "warn"
nursery = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
